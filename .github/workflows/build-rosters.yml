name: Build rosters

on:
  # Daily at 19:00 UTC = 07:00 NZST (or 08:00 NZDT). Generates roster PDFs for
  # any game starting in the next 4 days. boxscores.json also lists games up to
  # 11 days out (no PDF yet) so the hockeyrosters page can show them as 'coming
  # soon' further ahead than the portal (see --manifest-within-days below).
  schedule:
    - cron: "30 17 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest

      - name: Run unit tests
        run: PYTHONPATH=src python -m pytest tests/ -v

      - name: "Generate rosters (PDFs: next 4 days, manifest lookahead: 11 days)"
        id: build
        run: |
          python -m nzwihl_rosters --within-days 4 --manifest-within-days 11 --output ./output | tee build.log
          shopt -s nullglob
          pdfs=(output/*.pdf)
          if [ ${#pdfs[@]} -eq 0 ]; then
            echo "no_pdfs=true" >> "$GITHUB_OUTPUT"
            echo "No PDFs produced — exiting without a release."
          else
            echo "no_pdfs=false" >> "$GITHUB_OUTPUT"
            ls -la output/
          fi

      - name: Publish release
        if: steps.build.outputs.no_pdfs == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rosters-${{ github.run_number }}
          name: "Upcoming rosters · run ${{ github.run_number }}"
          body_path: build.log
          files: |
            output/*.pdf
            output/boxscores.json

      - name: Commit box-score manifest
        # Runs regardless of no_pdfs — the manifest now self-prunes stale
        # entries even on days with nothing new to publish, so it must be
        # committed every run, not just when a release goes out.
        run: |
          [ -f output/boxscores.json ] || { echo "no boxscores.json"; exit 0; }
          cp output/boxscores.json boxscores.json
          new=$(jq -S . boxscores.json 2>/dev/null || cat boxscores.json)
          old=$(git show HEAD:boxscores.json 2>/dev/null | jq -S . 2>/dev/null || echo "")
          if [ "$new" = "$old" ]; then echo "boxscores.json unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add boxscores.json
          git commit -m "Update box-score manifest [skip ci]"
          git push
